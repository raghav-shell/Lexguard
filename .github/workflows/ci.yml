name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lexguard_frontend/package-lock.json
      - run: python -m pip install -r lexguard_backend/requirements.txt
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r lexguard_backend/requirements.txt --no-deps --disable-pip --progress-spinner off
      - run: python -m unittest discover -s lexguard_backend/tests -v
      - run: python lexguard_backend/scripts/generate_contract.py --check
      - run: npm ci --ignore-scripts
        working-directory: lexguard_frontend
      - run: npm audit --audit-level=high
        working-directory: lexguard_frontend
      - run: npm run lint
        working-directory: lexguard_frontend
      - run: npm run typecheck
        working-directory: lexguard_frontend
      - run: npm test
        working-directory: lexguard_frontend
      - run: npm run build
        working-directory: lexguard_frontend
