# render.yaml — LEXGUARD Backend Deployment on Render.com

services:
  - type: web
    name: lexguard-backend
    runtime: python
    rootDir: lexguard_backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 20
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ANALYSIS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-sonnet-4.6
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
