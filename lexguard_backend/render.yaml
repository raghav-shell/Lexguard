# render.yaml — LEXGUARD Backend Deployment on Render.com

services:
  - type: web
    name: lexguard-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-3.5-sonnet
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
